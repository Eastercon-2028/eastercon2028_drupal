      value: '<p>Version 1 - May 2026</p><p dir="ltr"><strong>This Code of Conduct is a living document and will be updated as needed.&nbsp; We acknowledge the help of Milena Popova, Mark Wesley Pritchard, Punctuation, Ytterbium, Nine Worlds, Reclamation 2022, Levitation 2024, the Glasgow 2024 WorldCon, Iridescence 2026, and other conventions in the development of this Code of Conduct.</strong></p><p dir="ltr"><strong>Agreeing to comply with the convention Code of Conduct is a condition of attending EasterCon 2028.</strong></p><h2 dir="ltr">Anti-harassment Policy</h2><p dir="ltr">Eastercon is intended to be a safe place for all the diverse people in our community to spend a weekend talking, watching and interacting with all things SF/F related.</p><h3 dir="ltr">Why does EasterCon need an anti-harassment policy?</h3><p dir="ltr">We have implemented an anti-harassment policy in response to widespread reports of harassment in geek communities and at conventions around the world. There are a multitude of reports and references that are easily searchable on the Internet. The anti-harassment policy applies to all in attendance at Eastercon, including Guests of Honour, and covers behaviour towards venue staff as well as members.</p><p dir="ltr">We are bound by the Equality Act 2010, including the list of protected characteristics, which can be found here<a href="https://www.equalityhumanrights.com/en/equality-act/protected-characteristics">&nbsp;https://www.equalityhumanrights.com/en/equality-act/protected-characteristics</a>&nbsp;</p><p dir="ltr">We define harassment as including (but not limited to) the following:</p><ul><li dir="ltr" data-list-item-id="e7585339792d3688869181dabb30fd9ff">Uninvited physical contact.</li><li dir="ltr" data-list-item-id="e2c7cf478d226b3ecfcb240fd12544c64">Uninvited attention.</li><li dir="ltr" data-list-item-id="e15c8e3cd0e50dcf057cbd0d0bb1404af">Deliberate intimidation, stalking, following.</li><li dir="ltr" data-list-item-id="e94edd6e0780e0121345c8222e7ce8e85">Offensive verbal comments. These may be related to (but not exclusively related to) gender, gender identity and expression, sexual orientation, disability, physical appearance, body size, race, age, religion; and include rape “jokes”.</li><li dir="ltr" data-list-item-id="e1f81c1389228c23a63917bdaa273c00c">Wearing t-shirts or badges that are well known to be offensive, or the wearer has been asked to remove in the past; refusing to remove items that are pointed out to the wearer as offensive by the committee or a representative of the committee.</li><li dir="ltr" data-list-item-id="eff43e489c955c680452f84a50fc0a5b8">Taking a photograph or recording someone without their express permission.</li><li dir="ltr" data-list-item-id="e29ad305e01586787d3fe26f6690ad33b">Sustained disruption of talks or other events.</li><li dir="ltr" data-list-item-id="e933ecfbfff420a89d5eb86e08d7d58fc">Deliberate dead-naming or misgendering.</li><li dir="ltr" data-list-item-id="e52b29f604a6a3695cf63618756e677bf">Ignoring access needs or obstructing accessible routes.</li><li dir="ltr" data-list-item-id="ea5c32e7f106b32f3e91cd871d1848067">Tone-policing of marginalised people.</li><li dir="ltr" data-list-item-id="e11107d95285a6f7155145bb8e8f8b7d2">Targeting with abusive comments through social media or other electronic means.</li><li dir="ltr" data-list-item-id="e8f368de8825b9c95de8c439e3d272888">Misusing the Code of Conduct in order to harass other convention members.</li></ul><p dir="ltr">We ask you to be sensitive to the fact that what you do not see as harassing behaviour, others may view as such and you could be asked to stop what you are doing. You must do so immediately. However harmless your initial intent, such as believing it was a mutually enjoyable joke, if you persist, then your intention is to harass.</p><p dir="ltr">If we receive a formal complaint, we will ask the harasser to stop. If they do not, we will take further action.&nbsp; Repeated breaches could lead to the harasser’s membership of the Convention being withdrawn.</p><p dir="ltr">Ultimately, we ask you to please be on your best behaviour.</p><h3 dir="ltr">Where to go if you’re being harassed or observe harassment</h3><p dir="ltr">If you are being harassed, or you notice that someone else is being harassed, or you have any other concerns, please contact the Ops Help Desk, or send someone to contact the Ops Help Desk immediately. The Ops Help Desk will be clearly labelled and identified in the convention map. If you observe harassment please contact Ops immediately. Intervening without the full facts has in the past inadvertently supported a harasser.&nbsp;</p><p dir="ltr">We aim to provide a listening service which you can use to speak to a listener confidentially.&nbsp; This will include arrangements for independent reporting if you are being harassed by a member of the Con team or a volunteer.&nbsp; Details will be provided closer to the convention.&nbsp;&nbsp;</p><p dir="ltr">Convention staff will be happy to help participants contact venue security or local law enforcement, provide escorts, or otherwise assist those experiencing harassment to feel safe for the duration of the convention.</p><p dir="ltr">If you wish to report, we will take details of the harassment and work with you to respond to the issue in a way that assists you in feeling safe and maintains the safety of the wider convention environment, as well as enforcing our anti-harassment policy. Details of any harassment will be kept confidential and on a need-to-know basis. If you report a serious criminal matter, please be aware that we may be obliged to contact the police. We would however take into account any concerns you may have around involving them.</p><p dir="ltr">We expect participants to follow these rules throughout the venue and at all social events.</p><p dir="ltr">Should anything come to a dispute (which we fervently hope it will not), the committee will remain the final arbiters of what is harassment.&nbsp;</p><p dir="ltr">In the unlikely event that someone is asked to leave the convention because of a dispute, this will be done without refund of membership or any other costs incurred.</p><h2 dir="ltr">Anti-racism statement</h2><p dir="ltr">Racism is present across all sections of society, including our own fannish communities. EasterCon is committed to being as close to oppression free as possible, and central to this is our policy on racism, including prejudice, bias, the expression of privilege, aggressions, and microaggressions. This includes contributions made in discussion sessions and also things said to and about other EasterCon members as well as members of the public.</p><p dir="ltr">During the convention we want to ensure no one is talked over, ignored, or dismissed. We are committed to making EasterCon 2028 as accessible as we can to people from all racial and ethnic backgrounds.</p><h2 dir="ltr">Anti-sexism statement</h2><p dir="ltr">This statement applies to all women and should be read alongside the anti-harassment policy above. We recognise that, as in the wider community, fandom can be unwelcoming and unsafe for women. EasterCon 2028 is committed to being as close to oppression free as possible, and central to this is our policy on sexism, including bias, the expression of privilege, aggression and microaggressions. We will not tolerate gender-based slurs, the questioning of gender, deliberate misgendering, or jokes based on misogyny. We aim to have panel equality on the programme.</p><h2 dir="ltr">Anti-transphobia statement</h2><p dir="ltr">We want EasterCon to be a safe place for transgender people, including non-binary, genderfluid and gender-queer people. We will not tolerate anti-trans slurs, questioning of gender or gender presentation, misgendering of trans people, or “jokes” or comments rooted in anti-trans prejudice.&nbsp; We acknowledge that individual convention members may hold gender critical views, but note that the expression of these views in convention spaces is likely to be viewed as harassment. Transgender people are among the most marginalised in UK society and EasterCon 2028 prioritises creating an inclusive environment for them.</p><h2 dir="ltr">Cosplay is not consent</h2><p dir="ltr">EasterCon has a long tradition of its members taking part in costuming.&nbsp; Please treat cosplayers with respect.&nbsp; In particular -&nbsp;</p><ul><li dir="ltr" data-list-item-id="e7bdd4a4a1d205d7a8f48ffa809215813">If you want a picture with a cosplayer, please ask for permission first. Don''t take a photo or photos without a cosplayer’s knowledge. If a cosplayer declines a photo with you for any reason, respect their decision and thank them for their time.</li><li dir="ltr" data-list-item-id="ed4fdd7b269ad0499c3b7ca84e3afc222">Many cosplayers make their own props.&nbsp; If you want to hold a prop of theirs that you admire, please ask first, and hold them carefully.</li><li dir="ltr" data-list-item-id="e25b7c2b4e31ee6cd459a7298b2845af1">Feel free to compliment someone’s cosplay, but please do it in a respectful manner.</li><li dir="ltr" data-list-item-id="ec8f1c59e687fd4ddfb0fc73513cf9cc7">Cosplay is not an invitation to degrade and/or sexualize any cosplayer in any way. This includes staring.</li><li dir="ltr" data-list-item-id="e08dd1c39040452896207862dd1cc8646">Do not touch a cosplayer without their permission.</li></ul><h2 dir="ltr">Badges</h2><p dir="ltr">EasterCon 2028 is only open to members who have attending memberships, day memberships or other passes issued by the convention. All members must wear their badge while in the convention space, in a way that makes it clearly visible. All members must be able to present their badge when challenged by convention staff and volunteers. The person to whom a badge is issued is responsible for its use. Badges are not transferable and if a badge is lost, there will be a small charge to cover administration.</p><h2 dir="ltr">Children at the convention</h2><p dir="ltr">Children aged 6 and older must have a purchased child membership or day membership for the convention, while children under 5 must be registered as infants. All children under 12 must be accompanied by a responsible guardian.</p><p dir="ltr">For child protection reasons, a parent or guardian should remain with children during all workshops and child-friendly programme items.&nbsp;</p><p dir="ltr">All convention areas are open to members of all ages, with the exception of events, exhibits or items that are specifically noted to be inappropriate for minors and to which access is controlled.</p><h2 dir="ltr">Privacy, Photographs, and Electronic Recordings</h2><p dir="ltr">Please be aware that photography, video and/or audio recordings are frequently made by EasterCon during proceedings. The likenesses of convention attendees and members may appear in those recordings. Attendees and members agree to assign without compensation the use of their likeness in promotional material. This guidance will be revised in light of any on-line con content.</p><h2 dir="ltr">Personal Photography/Recordings</h2><p dir="ltr">Please be polite and ask before taking photographs or recordings of members and attendees whenever possible. Video and audio recording and photography for personal archival use only is generally acceptable, unless individuals make it clear that they do not wish to be photographed or recorded. In that case, any specific photography or recording of them is expressly forbidden. Anyone who persists in filming/recording/photographing EasterCon members who have denied their consent will be expelled from the convention.</p><h2 dir="ltr">Social Media</h2><p dir="ltr">This Code of Conduct applies equally to use of social media such as (but not limited to) Facebook, Instagram and X. Online harassment of, or prejudiced conduct towards, another member of the convention will be treated in the same way as face-to-face misconduct.</p><h2 dir="ltr">Media Relations</h2><p dir="ltr">Members of the press are expected to abide by this Code of Conduct and also by our Press Policy which is in development.</p><h2 dir="ltr">Sales of Merchandise</h2><p dir="ltr">The offering for sale of any merchandise at the convention may be undertaken only in designated spaces with permission from the convention.</p><h2 dir="ltr">Financial Transactions</h2><p dir="ltr">Anyone who owes an outstanding balance to EasterCon 2028 (e.g. outstanding payment on a membership instalment plan or dealer table rental) must settle that balance before being permitted to attend the convention.</p><h2 dir="ltr">Smoking</h2><p dir="ltr">Smoking is not allowed in any public buildings, including the convention spaces, restaurants and bars. This includes the smoking of e-cigarettes.</p><h2 dir="ltr">Venue</h2><p dir="ltr">Alcohol: there will be a Real Ale bar at the venue. Members may take drinks into all parts of the convention with the exception of the Art Show and the Dealers’ room.</p><p dir="ltr">The legal drinking age in UK is 18. Members under the age of 25 may be asked to produce photo ID at any point.</p><p dir="ltr">Signs: no signs may be put up anywhere in the venue.</p><p dir="ltr">Gender-neutral toilets will be labelled within the con space of the venue.</p><p dir="ltr">We will not be policing the use of disabled toilets and remind all members that some disabilities are invisible.</p><h2 dir="ltr">Weapons</h2><p dir="ltr">No actual weapon, or any item that can be mistaken for one, may be carried either openly or concealed at any time on properties being used by or for EasterCon. This includes weapons as a part of costumes. If you are unsure whether an item falls into this category, ask Ops for advice.</p><p dir="ltr">Any actual weapon, or any item that can be mistaken for one, that you have purchased from a Dealer must be wrapped and immediately transported to your hotel room or vehicle. Any item that is used in a threatening or harmful manner may be confiscated and the carrier may be asked to leave the convention.</p><h2 dir="ltr">Interpretation</h2><p dir="ltr">EasterCon 2028 reserves the right to amend these rules at any time without prior or posted notice and reserves the sole right of interpretation.</p><p dir="ltr">Please keep in mind that these rules involve, of course, “worst-case” scenarios and are put in place to ensure the safety and comfort of our members. They are not all-inclusive; in all cases, the singular rule that supersedes all others is:</p><p dir="ltr">Any action or behaviour that:</p><ul><li dir="ltr" data-list-item-id="e6359f65f52a74a08d40901a9aff85815">is illegal,</li><li dir="ltr" data-list-item-id="e3d7ccaaadc2c35cafc75567a31397826">causes significant interference with convention operations or excessive discomfort to other attendees, or</li><li dir="ltr" data-list-item-id="e4749d41195570dbe5e7e30a264346694">adversely affects EasterCon’s relationship with its guests, its venue, or the public,&nbsp;</li></ul><p dir="ltr">is strictly forbidden and may result in revocation of membership and/or attendance privileges.</p><h2 dir="ltr">Do you have feedback?</h2><p dir="ltr">If you have any feedback on the policy, email <a href="mailto:chair@eastercon2026.org">chair@eastercon2028.org</a></p>'
