  field_bio:
    -
      value: '<p>Adam Roberts has a parallel career as an academic, teaching English at Royal Holloway, and an author.</p><p>His first novel Salt was nominated for the Arthur C. Clarke Award, the first of three nominations. While Jack Glass won the 2012 BSFA Award. He has also twice won the BSFA Award for non-fiction for his criticism.&nbsp;</p><p>As well as his serious novels, he writes parodies, including The Soddit credited to A. R. R. Roberts. &nbsp;&nbsp;</p><p>Adam was invited to be a guest at Concentric, the convention that was cancelled due to Covid.</p>'
