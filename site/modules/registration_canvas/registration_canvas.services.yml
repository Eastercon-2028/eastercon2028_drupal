services:
  registration_canvas.heading_splitter:
    class: Drupal\registration_canvas\HeadingSplitter
  registration_canvas.twig.heading:
    class: Drupal\registration_canvas\Twig\HeadingExtension
    arguments: ['@registration_canvas.heading_splitter']
    tags:
      - { name: twig.extension }
  registration_canvas.heading_highlighter:
    class: Drupal\registration_canvas\HeadingHighlighter
    arguments: ['@registration_canvas.heading_splitter']
  Drupal\registration_canvas\HeadingHighlighter: '@registration_canvas.heading_highlighter'
