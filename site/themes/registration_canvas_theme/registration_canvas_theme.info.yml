name: 'Registration Canvas Theme'
type: theme
'base theme': registration_theme
description: 'A generic base theme for Drupal Canvas sites built on Registration Theme. Provides Canvas-ready single-directory components styled with Registration Theme design tokens. Brand colours, fonts and logos belong in a subtheme.'
package: Custom
core_version_requirement: ^11
libraries:
  - registration_canvas_theme/base
dependencies:
  - registration_canvas:registration_canvas
