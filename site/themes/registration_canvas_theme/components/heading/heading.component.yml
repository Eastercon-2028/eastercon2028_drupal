'$schema': https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Heading
description: A heading whose opening letters can be styled differently from the rest, using the heading_lead filter from the registration_canvas module.
group: Base
status: stable
props:
  type: object
  required:
    - level
    - text_size
    - text_color
    - align
  properties:
    heading_text:
      type: string
      title: Heading
      default: Enter title
      examples:
        - Your heading goes here
    level:
      type: number
      title: Heading level
      enum: [1, 2, 3, 4, 5, 6]
      default: 2
      examples:
        - 2
    text_size:
      type: string
      title: Text size
      enum:
        - default
        - heading-responsive-8xl
        - heading-responsive-7xl
        - heading-responsive-6xl
        - heading-responsive-5xl
        - heading-responsive-4xl
        - heading-responsive-3xl
        - heading-responsive-2xl
        - heading-responsive-xl
        - heading-responsive-lg
      meta:enum:
        default: Default for heading level
        heading-responsive-8xl: 8XL
        heading-responsive-7xl: 7XL
        heading-responsive-6xl: 6XL
        heading-responsive-5xl: 5XL
        heading-responsive-4xl: 4XL
        heading-responsive-3xl: 3XL
        heading-responsive-2xl: 2XL
        heading-responsive-xl: XL
        heading-responsive-lg: L
      default: default
      examples:
        - heading-responsive-4xl
    text_color:
      type: string
      title: Text color
      enum:
        - default
        - inverted
        - primary
        - muted
        - accent
      meta:enum:
        default: Default
        inverted: Inverted text
        primary: Primary
        muted: Muted
        accent: Accent
      default: default
      examples:
        - default
    align:
      type: string
      title: Text alignment
      enum:
        - left
        - center
        - right
      meta:enum:
        left: Left
        center: Center
        right: Right
      default: left
      examples:
        - left
    url:
      type: string
      title: Link
      format: uri-reference
    highlight_lead:
      type: boolean
      title: Highlight opening letters
      description: Wraps the start of the heading in a span that the site theme can style.
      default: true
      examples:
        - true
