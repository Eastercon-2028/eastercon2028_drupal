'$schema': https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Navbar
description: The menu area of the site header, with a slot for the navigation menu and a slot for call-to-action buttons. Place it in the "Primary menu" region; the theme's header supplies the logo area, the sticky behaviour and the mobile menu toggle.
group: Layout
props:
  type: object
  properties:
    menu_align:
      title: Menu alignment
      description: Where the menu sits when there is room (on wide screens).
      type: string
      enum: [left, center, right]
      meta:enum:
        left: Left
        center: Center
        right: Right
      default: center
      examples:
        - center
slots:
  navigation:
    title: Navigation menu
  links:
    title: CTAs
