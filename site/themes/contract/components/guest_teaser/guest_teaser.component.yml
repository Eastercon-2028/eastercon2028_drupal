$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Guest teaser
description: A guest's photo in a circle with their name under it, linking to their page. The home page's guests panel renders each guest with it (via Views Row SDC).
group: Card
status: stable
props:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      title: Name
      examples:
        - Adam Roberts
    url:
      type: string
      title: Link
      description: The guest's page. The whole teaser, photo and name, links to it.
      format: uri-reference
    heading_level:
      type: integer
      title: Heading level
      description: The level of the name's heading. Use 3 under a section heading.
      enum: [2, 3, 4, 5, 6]
      default: 3
      examples:
        - 3
slots:
  photo:
    title: Photo
    description: The guest's photo. It is cropped to a circle, so a square image works best.
